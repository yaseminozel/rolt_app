server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # Universal links: iOS opens /u/ and /r/ links straight in the app when it is installed.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/apple-app-site-association =404;
  }
  # Share links from the app: /u/<username> (profile) and /r/<ride id> (ride).
  location ~ ^/(u|r)/[^/]+/?$ {
    add_header Cache-Control "no-cache";
    try_files /open.html =404;
  }
  location ~* \.(jpg|png)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location / {
    try_files $uri =404;
  }
}
