server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location ~* \.(jpg|png)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location / {
    try_files $uri =404;
  }
}
