server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/xml;

  # Pages rendered by the `site` edge function (supabase/functions/site): route pages and lists,
  # share links with real link previews, static maps, the sitemap. Docker's DNS resolves the
  # Supabase host per request, so nginx starts even when it can't be reached.
  resolver 127.0.0.11 valid=300s ipv6=off;
  resolver_timeout 5s;
  set $site_fn https://supabase.roltapp.com/functions/v1/site;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # Universal links: iOS opens /u/, /r/ and /rota/ links straight in the app when it is installed.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files /.well-known/apple-app-site-association =404;
  }
  # Share links from the app: /u/<username> (profile) and /r/<ride id> (ride). If the function is
  # down, the static page still opens the app.
  location ~ ^/(u|r)/[^/]+/?$ {
    proxy_pass $site_fn$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name supabase.roltapp.com;
    proxy_set_header Host supabase.roltapp.com;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @share_fallback;
  }
  location @share_fallback {
    add_header Cache-Control "no-cache";
    try_files /open.html =404;
  }
  # Route pages, lists, static maps and the sitemap (before the image rule below: maps are .png).
  location ~ ^/(rota/[^/]+|rotalar(/[^/]+)?|harita/(rota|r)/[^/]+\.png|sitemap\.xml)/?$ {
    proxy_pass $site_fn$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name supabase.roltapp.com;
    proxy_set_header Host supabase.roltapp.com;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
  }
  location ~* \.(jpg|png)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location / {
    try_files $uri =404;
  }
}
